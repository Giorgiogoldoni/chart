name: RAPTOR Chart Data Update

on:
  schedule:
    - cron: '0 10 * * 1-5'    # 12:00 Italia (estate UTC+2)
    - cron: '30 16 * * 1-5'   # 18:30 Italia (estate UTC+2)
  workflow_dispatch:            # run manuale dal tab Actions

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas

      - name: Run fetch
        run: python fetch.py

      - name: Commit and push data
        run: |
          git config user.name  "RAPTOR Bot"
          git config user.email "raptor-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "📊 RAPTOR data $(date -u '+%d/%m/%Y %H:%M')"
          git push
